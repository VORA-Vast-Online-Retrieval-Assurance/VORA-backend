[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vora"
version = "0.1.0"
description = "VORA: Vast Online Retrieval & Assurance. Describe the data you want, get a dataset you can check."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "instructor>=1.0.0",
  "litellm>=1.0.0",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "playwright>=1.48.0",
  "pydantic>=2.0.0",
  "PyJWT[crypto]>=2.8.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["vora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
