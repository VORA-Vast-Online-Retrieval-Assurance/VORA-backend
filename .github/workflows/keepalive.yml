name: Keep the Space awake

# A free Hugging Face Space sleeps after ~48 h without traffic, which pauses live tracking.
# Set the repository variable SPACE_URL (e.g. https://<user>-vora-api.hf.space). Check Hugging Face's current
# terms before relying on this; delete the file to stop it.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          SPACE_URL: ${{ vars.SPACE_URL }}
        run: |
          test -n "$SPACE_URL" || { echo "Set the SPACE_URL repository variable"; exit 0; }
          curl -fsS --retry 3 --retry-delay 20 --max-time 60 "$SPACE_URL/health"
